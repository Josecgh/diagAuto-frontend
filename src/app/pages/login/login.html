<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a class="back-link" routerLink="/">&larr; Volver al inicio</a>
    <p class="eyebrow">TU ESPACIO DIAGAUTO</p>
    <h1 id="login-title">Qu&eacute; bueno verte</h1>
    <p class="intro">Inicia sesi&oacute;n para consultar tus veh&iacute;culos.</p>

    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <label for="email">Correo electr&oacute;nico</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="email" required email>

      <label for="password">Contrase&ntilde;a</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required>

      <button type="submit" [disabled]="loginForm.invalid || submitting()">
        {{ submitting() ? 'Iniciando sesi&oacute;n...' : 'Iniciar sesi&oacute;n' }}
      </button>
    </form>

    @if (message()) {
      <p class="feedback" [class.success]="successful()" role="status">{{ message() }}</p>
    }
    <p class="switch-page">&iquest;A&uacute;n no tienes cuenta? <a routerLink="/register">Reg&iacute;strate</a></p>
  </section>
</main>
